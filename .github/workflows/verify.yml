name: Verify public project artifacts

on:
  pull_request:
  push:
    branches: [main, 'project/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: baseline/requirements.txt
      - run: python -m pip install -r baseline/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_public_artifacts.py
